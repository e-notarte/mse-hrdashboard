<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>HR Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}


body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f3f4f6;
padding:20px;

}



.card{

width:100%;
max-width:420px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);

}



h1{

text-align:center;
color:#2563eb;
font-size:28px;

}



p{

text-align:center;
color:#6b7280;
margin:15px 0 30px;

}




input{


width:100%;
padding:14px;

margin-bottom:15px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;


}



button{


width:100%;

padding:14px;

background:#2563eb;

color:white;

border:none;

border-radius:10px;

font-size:16px;

cursor:pointer;


}



button:hover{

background:#1d4ed8;

}



/* Mobile */

@media(max-width:480px){


.card{

padding:25px;

}


h1{

font-size:22px;

}


}


</style>

</head>



<body>



<div class="card">



<h1>
Employee Records System
</h1>


<p>
HR Management Portal
</p>




<input 
id="username"
placeholder="Username">





<input 
id="password"
type="password"
placeholder="Password">






<button onclick="login()">

Sign In

</button>




<div class="footer">

HRIS • Employee Management System

</div>



</div>






<script>


const API =
"https://script.google.com/macros/s/AKfycbzezBohAZ-Z4UanqTZs7aawThBC4gZ4UQZI_TWMtClUcAzZiRG-yLZUzBzhcUteVoU/exec";





function login(){



let username =

document.getElementById("username")
.value.trim();




let password =

document.getElementById("password")
.value.trim();






fetch(API,{


method:"POST",


body:JSON.stringify({


action:"login",


username:username,


password:password



})


})





.then(response=>response.text())





.then(result=>{



console.log(
"Server response:",
result
);






if(result.trim()=="SUCCESS"){



window.location.href =
"hr-dashboard.html";



}





else{


alert(
"Invalid Login: " + result
);



}





})





.catch(error=>{



console.log(error);


alert(
"Connection Error"
);



});



}



</script>




</body>


</html>
