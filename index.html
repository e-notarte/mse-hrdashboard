<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>HR Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;

}


body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#fefce8;

}



/* LOGIN CARD */

.card{

width:420px;
background:white;
padding:40px;
border-radius:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.12);

border-top:8px solid #22c55e;

}



/* TITLE */

h1{

text-align:center;
color:#15803d;
font-size:28px;

}


/* SUBTITLE */

p{

text-align:center;
color:#78716c;
margin-bottom:30px;

}



/* INPUT */

input{


width:100%;
padding:12px;
margin-bottom:15px;

border-radius:10px;

border:1px solid #d1d5db;

outline:none;

}


input:focus{

border-color:#f59e0b;

}



/* BUTTON */

button{


width:100%;

padding:14px;

background:#f97316;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:600;

font-size:15px;

}



button:hover{


background:#ea580c;


}



/* FOOTER */

.footer{


margin-top:25px;

text-align:center;

font-size:13px;

color:#a8a29e;


}



</style>


</head>



<body>



<div class="card">



<h1>
Employee Records System
</h1>


<p>
HR Management Portal
</p>




<input 
id="username"
placeholder="Username">





<input 
id="password"
type="password"
placeholder="Password">






<button onclick="login()">

Sign In

</button>




<div class="footer">

HRIS • Employee Management System

</div>



</div>






<script>


const API =
"https://script.google.com/macros/s/AKfycbzezBohAZ-Z4UanqTZs7aawThBC4gZ4UQZI_TWMtClUcAzZiRG-yLZUzBzhcUteVoU/exec";





function login(){



let username =

document.getElementById("username")
.value.trim();




let password =

document.getElementById("password")
.value.trim();






fetch(API,{


method:"POST",


body:JSON.stringify({


action:"login",


username:username,


password:password



})


})





.then(response=>response.text())





.then(result=>{



console.log(
"Server response:",
result
);






if(result.trim()=="SUCCESS"){



window.location.href =
"hr-dashboard.html";



}





else{


alert(
"Invalid Login: " + result
);



}





})





.catch(error=>{



console.log(error);


alert(
"Connection Error"
);



});



}



</script>




</body>


</html>
