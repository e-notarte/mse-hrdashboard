<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Active Employees</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;

}



body{


background:#fefce8;


padding:30px;


}




.container{


width:100%;


max-width:1200px;


margin:auto;


}






.card{


background:white;


padding:30px;


border-radius:20px;


box-shadow:

0 10px 30px rgba(0,0,0,.12);



border-top:8px solid #22c55e;


}






h1{


color:#15803d;


margin-bottom:10px;


}



.subtitle{


color:#78716c;


margin-bottom:25px;


}







.table-container{


overflow-x:auto;


}






table{


width:100%;


border-collapse:collapse;


}



th{


background:#22c55e;


color:white;


padding:12px;


text-align:left;


}



td{


padding:12px;


border-bottom:1px solid #ddd;


}






tr:hover{


background:#fef9c3;


}





button{


background:#f97316;


color:white;


border:none;


padding:12px 20px;


border-radius:10px;


cursor:pointer;


margin-bottom:20px;


}



button:hover{


background:#ea580c;


}





/* TABLET */


@media(max-width:900px){



body{

padding:20px;

}



}





/* MOBILE */


@media(max-width:600px){



body{

padding:12px;

}



.card{

padding:20px;

}



h1{

font-size:22px;

}



table{


font-size:13px;


}



}


</style>


</head>



<body>


<div class="container">


<div class="card">



<h1>
Active Employees
</h1>


<p class="subtitle">

Employee Directory - HRIS

</p>




<button onclick="loadEmployees()">

Refresh List

</button>




<div class="table-container">


<table>


<thead>


<tr>


<th>Employee ID</th>

<th>Last Name</th>

<th>First Name</th>

<th>Department</th>

<th>Position</th>

<th>Date Hired</th>

<th>Status</th>


</tr>


</thead>



<tbody id="employeeTable">


</tbody>



</table>


</div>



</div>


</div>





<script>


const API =

"https://script.google.com/macros/s/AKfycbzezBohAZ-Z4UanqTZs7aawThBC4gZ4UQZI_TWMtClUcAzZiRG-yLZUzBzhcUteVoU/exec";






function loadEmployees(){



fetch(API,{


method:"POST",


body:JSON.stringify({


action:"getEmployees"


})


})



.then(res=>res.json())



.then(data=>{



let table = "";




data.forEach(emp=>{


table += `

<tr>

<td>${emp.id}</td>

<td>${emp.lastName}</td>

<td>${emp.firstName}</td>

<td>${emp.department}</td>

<td>${emp.position}</td>

<td>${emp.dateHired}</td>

<td>${emp.status}</td>

</tr>

`;


});




document.getElementById("employeeTable").innerHTML=table;



})


.catch(error=>{


alert("Error loading employees");


console.log(error);


});



}



loadEmployees();



</script>




</body>


</html>
