<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">


<title>Employee Enrollment</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">



<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Inter',sans-serif;

}



body{


background:#fefce8;


padding:30px;


}



/* MAIN CONTAINER */


.container{


width:100%;


max-width:1200px;


margin:auto;


}





/* CARD */


.card{


background:white;


padding:35px;


border-radius:20px;



box-shadow:

0 10px 30px rgba(0,0,0,.12);



border-top:8px solid #22c55e;


}






/* HEADER */


.header h1{


color:#15803d;


font-size:30px;


}



.header p{


color:#78716c;


margin-top:8px;


}







/* SECTION TITLE */


.section-title{


margin-top:30px;


margin-bottom:20px;


font-size:18px;


font-weight:700;


color:#374151;


border-left:5px solid #f97316;


padding-left:10px;


}







/* FORM GRID */


.grid{


display:grid;


grid-template-columns:

repeat(2,1fr);


gap:20px;


}






/* FORM GROUP */


.form-group{


display:flex;


flex-direction:column;


}






label{


margin-bottom:8px;


font-size:14px;


font-weight:600;


color:#44403c;


}






input,
select{


padding:13px;


border-radius:10px;


border:1px solid #d1d5db;


outline:none;


font-size:15px;


}




input:focus,
select:focus{


border-color:#f59e0b;


}







/* FULL WIDTH FIELD */


.full{


grid-column:

span 2;


}







/* BUTTON AREA */


.actions{


margin-top:35px;


display:flex;


justify-content:flex-end;


gap:15px;


}







.btn{


padding:14px 30px;


border:none;


border-radius:10px;


cursor:pointer;


font-weight:600;


font-size:15px;


}






.save{


background:#22c55e;


color:white;


}



.save:hover{


background:#16a34a;


}






.next{


background:#f97316;


color:white;


}



.next:hover{


background:#ea580c;


}







/* ========================= */
/* TABLET VIEW */
/* ========================= */


@media(max-width:900px){



body{


padding:20px;


}




.card{


padding:30px;


}




.grid{


grid-template-columns:

repeat(2,1fr);


}




.header h1{


font-size:26px;


}



}








/* ========================= */
/* MOBILE VIEW */
/* ========================= */



@media(max-width:600px){



body{


padding:12px;


}





.card{


padding:22px;


border-radius:15px;


border-top:6px solid #22c55e;


}





.header h1{


font-size:22px;


}




.header p{


font-size:14px;


}





.section-title{


font-size:16px;


}




.grid{


grid-template-columns:

1fr;


gap:15px;


}






.full{


grid-column:

span 1;


}






input,
select{


font-size:14px;


padding:12px;


}







.actions{


flex-direction:column;


gap:12px;


}






.btn{


width:100%;


padding:13px;


}



}




</style>


</head>




<body>




<div class="container">





<div class="card">






<div class="header">


<h1>

Employee / Applicant Enrollment

</h1>



<p>

HR Employee Records Management System

</p>


</div>









<div class="section-title">

Personal Information

</div>







<div class="grid">







<div class="form-group">

<label>
Employee ID
</label>


<input

id="employeeID"

placeholder="EMP-0001">


</div>







<div class="form-group">

<label>

Employee Type

</label>



<select id="status">


<option>

Applicant

</option>


<option>

Employee

</option>


</select>


</div>







<div class="form-group">

<label>

First Name

</label>


<input id="firstName">


</div>







<div class="form-group">


<label>

Last Name

</label>


<input id="lastName">


</div>







<div class="form-group">


<label>

Middle Name

</label>


<input id="middleName">


</div>







<div class="form-group">


<label>

Birth Date

</label>


<input

type="date"

id="birthDate">


</div>







<div class="form-group">


<label>

Gender

</label>



<select id="gender">


<option>

Male

</option>


<option>

Female

</option>


</select>


</div>







<div class="form-group">


<label>

Contact Number

</label>


<input id="contact">


</div>







<div class="form-group full">


<label>

Email Address

</label>


<input

type="email"

id="email">


</div>





</div>









<div class="section-title">

Employment Information

</div>







<div class="grid">







<div class="form-group">


<label>

Department

</label>


<input id="department">


</div>







<div class="form-group">


<label>

Position

</label>


<input id="position">


</div>







<div class="form-group">


<label>

Date Hired

</label>


<input

type="date"

id="dateHired">


</div>





</div>









<div class="actions">





<button

class="btn back"

onclick="backDashboard()">

← Back

</button>







<button

class="btn save"

onclick="saveEmployee()">


Save Draft

</button>







<button

class="btn next">


Next →

</button>






</div>









</div>






</div>









<script>





function backDashboard(){


window.location.href =
"hr-dashboard.html";


}








function saveEmployee(){



let employee = {



employeeID:

document.getElementById("employeeID").value,



firstName:

document.getElementById("firstName").value,



lastName:

document.getElementById("lastName").value,



middleName:

document.getElementById("middleName").value,



birthDate:

document.getElementById("birthDate").value,



gender:

document.getElementById("gender").value,



email:

document.getElementById("email").value,



contact:

document.getElementById("contact").value,



department:

document.getElementById("department").value,



position:

document.getElementById("position").value,



dateHired:

document.getElementById("dateHired").value,



status:

document.getElementById("status").value



};






fetch(

"https://script.google.com/macros/s/AKfycbzezBohAZ-Z4UanqTZs7aawThBC4gZ4UQZI_TWMtClUcAzZiRG-yLZUzBzhcUteVoU/exec",


{


method:"POST",


body:JSON.stringify({


action:"saveEmployee",


data:employee


})


}


)






.then(res=>res.text())



.then(result=>{


alert(result);


});





}



</script>




</body>

</html>
