<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">


<title>Employee Enrollment</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">



<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;

}



body{


background:#fefce8;

padding:40px;


}




.container{


max-width:1200px;

margin:auto;


}





.card{


background:white;

padding:35px;

border-radius:20px;

box-shadow:

0 10px 30px rgba(0,0,0,.10);


border-left:8px solid #22c55e;


}






.header{


margin-bottom:30px;


}





.header h1{


color:#15803d;

font-size:30px;


}




.header p{


color:#78716c;

margin-top:8px;


}








.section-title{


margin-top:30px;

margin-bottom:20px;

font-size:18px;

font-weight:700;

color:#166534;


border-bottom:

2px solid #facc15;

padding-bottom:8px;


}






.grid{


display:grid;

grid-template-columns:

repeat(2,1fr);

gap:20px;


}







.form-group{


display:flex;

flex-direction:column;


}





label{


margin-bottom:8px;

font-size:14px;

font-weight:600;

color:#374151;


}






input,
select{


padding:12px;

border:

1px solid #d1d5db;


border-radius:10px;

outline:none;


}






input:focus,
select:focus{


border-color:#f59e0b;


box-shadow:

0 0 0 3px rgba(245,158,11,.15);


}






.full{


grid-column:

span 2;


}






.actions{


margin-top:35px;

display:flex;

justify-content:flex-end;

gap:15px;


}






.btn{


padding:13px 30px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:600;


}






.save{


background:#22c55e;

color:white;


}




.save:hover{


background:#16a34a;


}






.next{


background:#f97316;

color:white;


}




.next:hover{


background:#ea580c;


}






.back{


background:#facc15;

color:#374151;


}




.back:hover{


background:#eab308;


}






</style>



</head>




<body>




<div class="container">





<div class="card">






<div class="header">


<h1>

Employee / Applicant Enrollment

</h1>



<p>

HR Employee Records Management System

</p>


</div>









<div class="section-title">

Personal Information

</div>







<div class="grid">







<div class="form-group">

<label>
Employee ID
</label>


<input

id="employeeID"

placeholder="EMP-0001">


</div>







<div class="form-group">

<label>

Employee Type

</label>



<select id="status">


<option>

Applicant

</option>


<option>

Employee

</option>


</select>


</div>







<div class="form-group">

<label>

First Name

</label>


<input id="firstName">


</div>







<div class="form-group">


<label>

Last Name

</label>


<input id="lastName">


</div>







<div class="form-group">


<label>

Middle Name

</label>


<input id="middleName">


</div>







<div class="form-group">


<label>

Birth Date

</label>


<input

type="date"

id="birthDate">


</div>







<div class="form-group">


<label>

Gender

</label>



<select id="gender">


<option>

Male

</option>


<option>

Female

</option>


</select>


</div>







<div class="form-group">


<label>

Contact Number

</label>


<input id="contact">


</div>







<div class="form-group full">


<label>

Email Address

</label>


<input

type="email"

id="email">


</div>





</div>









<div class="section-title">

Employment Information

</div>







<div class="grid">







<div class="form-group">


<label>

Department

</label>


<input id="department">


</div>







<div class="form-group">


<label>

Position

</label>


<input id="position">


</div>







<div class="form-group">


<label>

Date Hired

</label>


<input

type="date"

id="dateHired">


</div>





</div>









<div class="actions">





<button

class="btn back"

onclick="backDashboard()">

← Back

</button>







<button

class="btn save"

onclick="saveEmployee()">


Save Draft

</button>







<button

class="btn next">


Next →

</button>






</div>









</div>






</div>









<script>





function backDashboard(){


window.location.href =
"hr-dashboard.html";


}








function saveEmployee(){



let employee = {



employeeID:

document.getElementById("employeeID").value,



firstName:

document.getElementById("firstName").value,



lastName:

document.getElementById("lastName").value,



middleName:

document.getElementById("middleName").value,



birthDate:

document.getElementById("birthDate").value,



gender:

document.getElementById("gender").value,



email:

document.getElementById("email").value,



contact:

document.getElementById("contact").value,



department:

document.getElementById("department").value,



position:

document.getElementById("position").value,



dateHired:

document.getElementById("dateHired").value,



status:

document.getElementById("status").value



};






fetch(

"https://script.google.com/macros/s/AKfycbzezBohAZ-Z4UanqTZs7aawThBC4gZ4UQZI_TWMtClUcAzZiRG-yLZUzBzhcUteVoU/exec",


{


method:"POST",


body:JSON.stringify({


action:"saveEmployee",


data:employee


})


}


)






.then(res=>res.text())



.then(result=>{


alert(result);


});





}



</script>




</body>

</html>
